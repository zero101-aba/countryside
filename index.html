<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#fbf3df" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>田园小镇 · 指令种田</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="styles-chat.css" />
<link rel="stylesheet" href="styles-theme.css" />
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="tb-left">
      <div class="coin" title="金币"><span class="coin-ic">🪙</span><b id="hud-money">0</b></div>
      <div class="date-line"><span id="hud-season-icon">🌱</span><span id="hud-date">春 · 第1天</span><span id="hud-season" class="sr">春季</span></div>
      <span id="hud-region" class="region-chip">青禾村</span>
    </div>
    <div class="tb-right">
      <span id="hud-weather" class="weather">☀️</span>
      <div id="speed-group" class="speed">
        <button data-speed="0" title="暂停">❚❚</button>
        <button data-speed="1" class="on">1×</button>
        <button data-speed="2">2×</button>
        <button data-speed="4">4×</button>
        <button data-speed="8">8×</button>
      </div>
      <button id="btn-skip-night" class="icon-btn hidden" title="跳过夜晚">🌙</button>
      <button id="btn-map" class="icon-btn" title="世界地图">🗺</button>
      <button id="btn-sound" class="icon-btn" title="声音">🔊</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="game"></canvas>
    <div id="world-hint"></div>
    <div id="goal-chip"><span class="gc-ic">🎯</span><span id="goal-text">第一次收获 0/1</span></div>
    <div id="follow-chip" class="hidden"><span class="fc-eye">👁</span><span>跟随</span><b id="follow-name">小伟</b><button id="follow-off" title="取消跟随">✕</button></div>
    <div id="bubbles"></div>
    <div id="task-banner" class="hidden">
      <div id="tb-avatar"></div>
      <div class="tb-main">
        <div class="tb-row"><b id="tb-title">—</b><span id="tb-sub">—</span></div>
        <div class="tb-track"><i id="tb-bar"></i></div>
      </div>
      <button id="tb-cancel" class="tb-cancel" title="取消指令">✕</button>
    </div>
    <div id="zoom-hint" class="fade">拖动平移 · 双指缩放</div>
  </main>

  <section id="bottom">
    <form id="commandbar" autocomplete="off">
      <input id="cmd-input" maxlength="80" placeholder="说句话：让小伟把3号地浇一下" />
      <button id="cmd-send" type="submit">传令</button>
    </form>
    <div id="cmd-chips">
      <button data-cmd="都去浇水">都浇水</button>
      <button data-cmd="把熟的都收了">收熟的</button>
      <button data-cmd="现在谁在干活">谁在干活</button>
      <button data-cmd="都停下">都停下</button>
      <button data-cmd="收牧产">收牧产</button>
    </div>
    <div id="cmd-feed"></div>
    <div id="roster"><div id="roster-inner"></div></div>
    <nav id="toolbar">
      <button id="btn-shop"><span>🏪</span>集市</button>
      <button id="btn-villagers"><span>👥</span>村民</button>
      <button id="btn-quests"><span>📜</span>委托</button>
      <button id="btn-stats"><span>📋</span>档案</button>
      <button id="btn-help"><span>❓</span>玩法</button>
      <button id="btn-orient"><span>⛶</span>横屏</button>
    </nav>
  </section>
</div>

<div id="sheet" aria-hidden="true">
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <h2 id="sheet-title">—</h2>
      <button id="sheet-close" class="sheet-close" aria-label="关闭">✕</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="toast"></div>
<div id="tutorial"></div>
<div id="day-card"></div>

<div id="chat" aria-hidden="true">
  <div class="chat-panel" role="dialog" aria-modal="true" aria-label="和村民聊天">
    <div class="chat-grab"></div>
    <header class="chat-head">
      <span class="chat-av" id="chat-av"></span>
      <div class="chat-who">
        <b id="chat-name">—</b>
        <small id="chat-role">—</small>
      </div>
      <button id="chat-close" class="chat-close" aria-label="关闭">✕</button>
    </header>
    <div class="chat-emo" id="chat-emo"></div>
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-topics" id="chat-topics"></div>
    <form class="chat-input" id="chat-form">
      <input id="chat-text" type="text" placeholder="跟他说点什么…" autocomplete="off" maxlength="40" />
      <button type="submit" id="chat-send">发送</button>
    </form>
  </div>
</div>

<script type="module" src="src/game.js?v=20261119b"></script>
<div id="map-overlay" class="hidden">
  <div id="map-card">
    <div id="map-head"><b>🗺 世界地图</b><span id="map-current"></span><button id="map-close" class="icon-btn">✕</button></div>
    <canvas id="map-canvas" width="512" height="416"></canvas>
    <div id="map-regions"></div>
  </div>
</div>
</body>
</html>
